# Both records must point to this server:
#   localmachine.in      A  <SERVER_IP>
#   *.localmachine.in    A  <SERVER_IP>
#
# The certificate must include localmachine.in and *.localmachine.in. A wildcard
# certificate requires an ACME DNS-01 challenge.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name localmachine.in *.localmachine.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localmachine.in www.localmachine.in;

    ssl_certificate /etc/letsencrypt/live/localmachine.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localmachine.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.localmachine.in;

    ssl_certificate /etc/letsencrypt/live/localmachine.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/localmachine.in/privkey.pem;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
